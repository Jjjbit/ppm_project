services:
  web:
    build: . #crea image secondo Dockerfile
    container_name: ppm_django_web
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    # command: python manage.py runserver 0.0.0.0:8000
    command: gunicorn django_project.wsgi:application --bind 0.0.0.0:8000 # per deployment
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: ppm_postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: